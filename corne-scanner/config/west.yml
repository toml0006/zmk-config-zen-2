manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: prospector
      url-base: https://github.com/toml0006
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Local fork of t-ogura/prospector-zmk-module @ v2.2.1 with a WPM
    # arc added to the Radii status screen (centered below the layer
    # name). Falls back to v2.2.1 behavior on every other layout.
    # Upstream: https://github.com/t-ogura/prospector-zmk-module
    - name: prospector-zmk-module
      remote: prospector
      revision: wpm-arc-radii
      path: modules/prospector-zmk-module
  self:
    path: config
