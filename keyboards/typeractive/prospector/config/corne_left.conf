# Left Corne half — split PERIPHERAL. The Prospector dongle is the central.
# Overrides the `default y` ZMK_SPLIT_ROLE_CENTRAL set by the upstream
# corne_left shield (ZMK does NOT strip the _left suffix, so a generic
# corne.conf is never auto-loaded — the file must be named per shield).
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
