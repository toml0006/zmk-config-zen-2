# Left Corne half — split CENTRAL + broadcaster.
# Owns the keymap, connects to the host over USB/BLE, and emits BLE
# status advertisements that the Prospector Scanner observes.

# nice!view display + sleep
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# --- Status advertisement broadcaster (from prospector-zmk-module, t-ogura fork) ---
# The scanner picks these adverts up passively — no BLE pairing involved.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Corne"

# Broadcast on channel 1; the scanner's CONFIG_PROSPECTOR_SCANNER_CHANNEL
# must match (or be 0 = receive-all).
CONFIG_PROSPECTOR_CHANNEL=1
