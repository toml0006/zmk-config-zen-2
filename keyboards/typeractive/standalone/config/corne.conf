# Sleep after one hour idle (1*60*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

# nice!view display on both halves
CONFIG_ZMK_DISPLAY=y

# --- BLE bond robustness ---------------------------------------------------
# Symptom this fixes: a host (macOS in particular) loses its side of the bond,
# and from then on the keyboard refuses the new pairing request, so the profile
# is stuck advertising forever. The only way back is BT_CLR on that profile --
# hence re-pairing the same machine over and over.
#
# EXPERIMENTAL_SEC implies BT_SMP_ALLOW_UNAUTH_OVERWRITE, which lets a fresh
# pairing overwrite the stale bond instead of rejecting it, so a host that
# forgets can simply re-pair on its own.
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Note what this does NOT do: it does not stop the bond being lost. It only
# allows recovery without BT_CLR, and only when the host comes back with the
# SAME peer address already stored in the profile. If the keyboard is the side
# that lost its keys, or the host's identity changed, this does not help.
#
# BT_SMP_ALLOW_UNAUTH_OVERWRITE implies passkey entry; declined here, so
# pairing stays Just Works. Per ble.c at the pinned revision, an occupied
# profile accepts a replacement only when the incoming peer address exactly
# matches the one already stored:
#
#   return zmk_ble_active_profile_is_open() ||
#          (IS_ENABLED(CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE) &&
#           bt_addr_le_cmp(zmk_ble_active_profile_addr(), bt_conn_get_dst(conn)) == 0);
#
# So taking a bond requires spoofing that exact address, in radio range, while
# the profile is advertising (host asleep or absent). The payoff is a nuisance
# -- the bond is replaced, and keystrokes go to the attacker's machine, which
# is immediately obvious because this one stops receiving them. It grants no
# access to the host. Acceptable for a desk keyboard; set to y if it travels.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Deliberately NOT set: CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START. It wipes every
# bond on each boot -- a debugging aid that looks like a fix and is not.

# Studio here runs over USB-UART (SNIPPET=studio-rpc-usb-uart), but
# CONFIG_ZMK_STUDIO_TRANSPORT_BLE defaults to y, which adds a Studio GATT
# service to the Studio build only. Alternating between that build and the
# plain one then changes the GATT database a host has cached for the same
# device. Set here rather than as a cmake arg in build.yaml, because the local
# Docker build (~/zmk-workspace/build.sh) passes its own cmake args and never
# reads build.yaml -- a setting placed there reaches CI builds only. Harmless
# in the non-Studio builds, where the symbol's dependency is unmet.
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n
