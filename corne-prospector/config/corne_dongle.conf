# Config for the Prospector dongle build (shield corne_dongle prospector_adapter).

# Split central talking to two peripherals (left + right Corne halves).
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# ZMK Studio — live keymap editing over USB (studio-rpc-usb-uart snippet
# on the dongle build target). Press &studio_unlock (FN layer top-right)
# to unlock the keyboard for edits.
CONFIG_ZMK_STUDIO=y

# --- Prospector display options (see prospector-zmk-module README) ---
# Fixed brightness: ambient light sensor disabled, display held at a
# constant level (1-100).
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=100
CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
