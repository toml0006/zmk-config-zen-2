<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kailh Choc v1 (PG1350) keycap - BOTTOM VIEW, 1u
  Units: 1 SVG user unit = 1 mm (viewBox matches mm width/height).
  Geometry only (outline + 2 stem slots) for clean Fusion 360 sketch import.

  Reference dimensions:
    Cap top footprint : 17.5 x 16.5 mm (1u, Choc 18x17 spacing)
    Stem slot pitch   : 5.70 mm center-to-center (horizontal)
    Slot size         : 1.20 mm (W) x 3.00 mm (H) each
    Slots centered on cap center (8.75, 8.25)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="17.5mm" height="16.5mm"
     viewBox="0 0 17.5 16.5">
  <g fill="none" stroke="#000000" stroke-width="0.1">
    <!-- Cap outer outline (slight corner radius) -->
    <rect x="0" y="0" width="17.5" height="16.5" rx="0.5" ry="0.5"/>
    <!-- Left stem slot -->
    <rect x="5.30" y="6.75" width="1.20" height="3.00" rx="0.30" ry="0.30"/>
    <!-- Right stem slot -->
    <rect x="11.00" y="6.75" width="1.20" height="3.00" rx="0.30" ry="0.30"/>
  </g>
</svg>
